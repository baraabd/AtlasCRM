services:
  db:
    image: postgres:16
    container_name: atlascrm-db
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm_pass
      POSTGRES_DB: crm_dev
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U crm -d crm_dev']
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: ghcr.io/baraabd/atlascrm-api:latest
    container_name: atlascrm-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # أهم متغير لـ Prisma
      DATABASE_URL: postgresql://crm:crm_pass@db:5432/crm_dev?schema=public
      API_PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-}
    ports:
      - '3000:3000'
    restart: unless-stopped

volumes:
  postgres_data:
