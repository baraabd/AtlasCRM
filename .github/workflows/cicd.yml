name: CICD

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
    tags: ["v*.*.*"]

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  IMAGE_NAME: atlascrm-api

jobs:
  lint-test-build:
    name: Matrix lint-test-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: crm-api
            workspace: apps/crm-api
          - name: crm-mobile
            workspace: apps/crm-mobile
          - name: shared-types
            workspace: packages/shared-types

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install deps (root)
        run: npm ci

      - name: Prisma generate (crm-api only)
        if: ${{ matrix.target.name == 'crm-api' }}
        run: npx prisma generate --schema apps/crm-api/prisma/schema.prisma

      - name: Lint
        run: npm -w ${{ matrix.target.workspace }} run lint --if-present

      - name: Typecheck
        run: npm -w ${{ matrix.target.workspace }} run typecheck --if-present

      - name: Test
        run: npm -w ${{ matrix.target.workspace }} test --if-present

      - name: Build
        run: npm -w ${{ matrix.target.workspace }} run build --if-present

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    needs: lint-test-build
    # build image فقط على push/tag (ليس على PR)
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag

      - name: Build (no push) with cache
        uses: docker/build-push-action@v5
        with:
          context: ./apps/crm-api
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-publish:
    name: docker-publish
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push with cache
        uses: docker/build-push-action@v5
        with:
          context: ./apps/crm-api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
