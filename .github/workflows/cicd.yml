name: CICD

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  IMAGE_NAME: atlascrm-api

jobs:
  lint-test-build:
    name: "Matrix: lint-test-build"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: crm-api
            path: apps/crm-api
          - name: crm-mobile
            path: apps/crm-mobile
          - name: shared-types
            path: packages/shared-types

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json

      - name: Install deps (root)
        run: npm ci

      - name: Check package.json exists
        id: pkg
        run: |
          if [ -f "${{ matrix.target.path }}/package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Prisma generate (crm-api only)
        if: matrix.target.name == 'crm-api'
        run: npx prisma generate --schema apps/crm-api/prisma/schema.prisma

      - name: Lint (non-blocking)
        if: steps.pkg.outputs.exists == 'true'
        run: npm --prefix ${{ matrix.target.path }} run lint --if-present
        continue-on-error: true

      - name: Typecheck
        if: steps.pkg.outputs.exists == 'true'
        run: npm --prefix ${{ matrix.target.path }} run typecheck --if-present

      - name: Test
        if: steps.pkg.outputs.exists == 'true'
        run: npm --prefix ${{ matrix.target.path }} test --if-present

      - name: Build
        if: steps.pkg.outputs.exists == 'true'
        run: npm --prefix ${{ matrix.target.path }} run build --if-present

  docker-build:
    name: "docker-build"
    runs-on: ubuntu-latest
    needs: lint-test-build
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image (local)
        run: docker build -t atlascrm-api:ci -f apps/crm-api/Dockerfile .


  docker-publish:
    name: "docker-publish"
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/atlascrm-api
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/crm-api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
